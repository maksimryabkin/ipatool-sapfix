version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
      time: "05:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 1
    groups:
      go-maintenance:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "05:15"
      timezone: Europe/Moscow
    open-pull-requests-limit: 1
    groups:
      actions-maintenance:
        patterns:
          - "*"

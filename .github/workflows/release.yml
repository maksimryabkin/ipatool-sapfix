name: Release macOS

on:
  push:
    tags:
      - "2.3.2-sapfix.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify source
        run: |
          go generate ./...
          git diff --exit-code
          go test ./...
          go vet ./...
          IPATOOL_TEST_APPLE_SAP=1 go test ./pkg/mescal \
            -run '^TestSignIntegration$' -count=1 -v
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: Build archives and checksums
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/ipatool-release"
          mkdir -p "$release_dir/bin"
          for arch in arm64 amd64; do
            binary="ipatool-${GITHUB_REF_NAME}-macos-${arch}"
            archive="${binary}.tar.gz"
            CGO_ENABLED=1 GOOS=darwin GOARCH="$arch" \
              CGO_CFLAGS="-mmacosx-version-min=10.15" \
              CGO_LDFLAGS="-mmacosx-version-min=10.15" \
              go build -trimpath \
                -ldflags="-s -w -X github.com/majd/ipatool/v2/cmd.version=${GITHUB_REF_NAME}" \
                -o "$release_dir/bin/${binary}" .
            COPYFILE_DISABLE=1 tar -C "$release_dir" \
              -czf "$release_dir/${archive}" "bin/${binary}"
            (
              cd "$release_dir"
              shasum -a 256 "$archive" > "${archive}.sha256sum"
              shasum -a 256 -c "${archive}.sha256sum"
            )
            file "$release_dir/bin/${binary}"
            go version -m "$release_dir/bin/${binary}"
          done
      - name: Publish prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_dir="$RUNNER_TEMP/ipatool-release"
          gh release create "$GITHUB_REF_NAME" \
            "$release_dir"/*.tar.gz \
            "$release_dir"/*.tar.gz.sha256sum \
            --verify-tag \
            --prerelease \
            --title "ipatool ${GITHUB_REF_NAME} — final macOS SAP compatibility build" \
            --notes-file - <<'EOF'
          ## Final macOS compatibility build

          This is a security rebuild of the historical macOS SAP login fix. It
          is built from the tagged source with Go 1.26.6 after tests, vet,
          `govulncheck`, and a macOS SAP signer smoke test pass in CI.

          Official ipatool v2.4.0 and newer now includes maintained SAP
          authentication. Use this release as a macOS transition build and move
          to the latest official ipatool package once your installation source
          offers v2.5.0 or newer built with a patched Go toolchain.

          Download the archive matching `uname -m` and its `.sha256sum` file.
          Verify it with `shasum -a 256 -c <file>.sha256sum` before installing.

          The binaries are not notarized. They contain no Apple credentials or
          authentication state. Never publish raw authentication logs.
          EOF
